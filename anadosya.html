<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kacakwhatsappbeyin 💬 | TR</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-storage-compat.js"></script>

    <style>
        :root { --main-red: #c8102e; --bg: #f0f2f5; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); overflow: hidden; height: 100vh; }
        .hidden { display: none !important; }

        /* Ana Ekran Düzeni */
        #app-screen { display: flex; height: 100vh; width: 100vw; }
        
        /* Sidebar (Mobil Duyarlı) */
        .sidebar { 
            width: 350px; border-right: 1px solid #ddd; display: flex; flex-direction: column; 
            background: white; transition: 0.3s; z-index: 100;
        }
        
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #e5ddd5; position: relative; }

        /* Header */
        .header { background: var(--main-red); color: white; padding: 12px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }

        /* Mesaj Alanı */
        .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        .msg { padding: 8px 12px; margin: 5px; border-radius: 12px; max-width: 80%; word-wrap: break-word; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sent { background: #ffeded; align-self: flex-end; border-bottom-right-radius: 2px; }
        .received { background: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        .msg img, .msg video { max-width: 100%; border-radius: 8px; margin-top: 5px; }

        /* Giriş/Yazma Çubuğu (Mobil İçin En Alta Sabitlendi) */
        .input-box { 
            background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 8px; 
            border-top: 1px solid #ccc; padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }
        .input-box input { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; }
        .btn-icon { background: var(--main-red); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }

        /* Mobil Görünüm Ayarları */
        @media (max-width: 700px) {
            .sidebar { position: absolute; left: 0; width: 100%; height: 100%; }
            .sidebar.closed { left: -100%; }
        }

        /* Ses Kaydı Efekti */
        .recording { background: #ff0000 !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="auth-screen">
    <div style="text-align: center; padding-top: 100px;">
        <h2 style="color:var(--main-red)">Kacakwhatsappbeyin TR</h2>
        <div id="login-box" class="box" style="display:inline-block; background:white; padding:20px; border-radius:10px;">
            <input type="email" id="email" placeholder="E-posta"><br>
            <input type="password" id="pass" placeholder="Şifre"><br>
            <button onclick="login()" style="background:var(--main-red); color:white; padding:10px 20px; border:none; border-radius:5px;">Giriş Yap</button>
            <p onclick="showRegister()" style="cursor:pointer; font-size:12px;">Kayıt Ol</p>
        </div>
    </div>
</div>

<div id="app-screen" class="hidden">
    <div class="sidebar" id="sidebar">
        <div class="header">
            <span id="user-display">Profil</span>
            <button onclick="logout()" style="font-size:10px; background:rgba(0,0,0,0.2); color:white; border:none; padding:5px;">Çıkış</button>
        </div>
        <div id="notif-area" style="background:#fff3f3"></div>
        <div style="padding:10px">
            <input type="text" id="target-email" placeholder="Arkadaş Ekle (E-posta)" style="width:70%; padding:5px;">
            <button onclick="sendFriendRequest()" style="background:var(--main-red); color:white; border:none; padding:6px;">Ekle</button>
        </div>
        <div id="friends-list" style="overflow-y:auto; flex:1"></div>
    </div>

    <div class="chat-area">
        <div class="header">
            <button onclick="toggleSidebar()" id="menu-btn" style="background:none; border:none; color:white; font-size:20px;">☰</button>
            <span id="current-chat-name">Sohbet Seç</span>
            <span>🇹🇷</span>
        </div>
        <div class="messages" id="msg-list"></div>
        
        <div class="input-box">
            <label class="btn-icon">
                +
                <input type="file" id="file-input" style="display:none" accept="image/*,video/*" onchange="uploadFile(this)">
            </label>
            
            <input type="text" id="m-text" placeholder="Mesaj yazın..." onkeypress="if(event.key==='Enter') sendMessage()">
            
            <button class="btn-icon" id="rec-btn" onclick="handleVoice()">🎤</button>
            
            <button class="btn-icon" onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<script>
    // SENİN ANAHTARLARIN
    const firebaseConfig = {
        apiKey: "AIzaSyAOK6T1Wk2k95mgRd6FNaQ1zoCMrJU-kFo",
        authDomain: "kacakwhatsappbeyin.firebaseapp.com",
        projectId: "kacakwhatsappbeyin",
        storageBucket: "kacakwhatsappbeyin.firebasestorage.app",
        messagingSenderId: "250064701061",
        appId: "1:250064701061:web:e025e7c2d9b0c623aa4bec"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const storage = firebase.storage();

    let currentChatUser = null;
    let mediaRecorder;
    let audioChunks = [];

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('closed'); }

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-display').innerText = user.displayName || user.email;
            loadFriends();
            listenRequests();
        } else {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
        }
    });

    // DOSYA YÜKLEME (Resim/Video)
    async function uploadFile(input) {
        if(!currentChatUser || !input.files[0]) return;
        const file = input.files[0];
        const fileName = Date.now() + "_" + file.name;
        const storageRef = storage.ref('uploads/' + fileName);
        
        alert("Dosya yükleniyor, lütfen bekleyin...");
        await storageRef.put(file);
        const url = await storageRef.getDownloadURL();
        
        const type = file.type.startsWith('image') ? 'image' : 'video';
        sendMediaMessage(url, type);
    }

    // SESLİ MESAJ MOTORU
    async function handleVoice() {
        const btn = document.getElementById('rec-btn');
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                btn.classList.remove('recording');
                const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                const fileName = "voice_" + Date.now() + ".mp3";
                const storageRef = storage.ref('voices/' + fileName);
                await storageRef.put(audioBlob);
                const url = await storageRef.getDownloadURL();
                sendMediaMessage(url, 'audio');
            };
            
            mediaRecorder.start();
            btn.classList.add('recording');
        } else {
            mediaRecorder.stop();
        }
    }

    function sendMediaMessage(url, type) {
        const myEmail = auth.currentUser.email;
        const chatId = [btoa(myEmail), btoa(currentChatUser)].sort().join("_");
        db.ref('chats/' + chatId).push({
            sender: myEmail,
            mediaUrl: url,
            mediaType: type,
            time: Date.now()
        });
    }

    // MESAJ GÖNDERME (ESKİ MOTOR + YENİ ÖZELLİKLER)
    function sendMessage() {
        const text = document.getElementById('m-text').value;
        if(!currentChatUser || !text.trim()) return;
        const myEmail = auth.currentUser.email;
        const chatId = [btoa(myEmail), btoa(currentChatUser)].sort().join("_");
        db.ref('chats/' + chatId).push({ sender: myEmail, text: text, time: Date.now() });
        document.getElementById('m-text').value = "";
    }

    // MESAJLARI GÖSTERME (RESİM/VİDEO/SES DESTEKLİ)
    function loadMessages() {
        const myEmail = auth.currentUser.email;
        const chatId = [btoa(myEmail), btoa(currentChatUser)].sort().join("_");
        db.ref('chats/' + chatId).on('value', snap => {
            const list = document.getElementById('msg-list');
            list.innerHTML = "";
            snap.forEach(child => {
                const m = child.val();
                const type = m.sender === myEmail ? 'sent' : 'received';
                let content = m.text || "";
                
                if(m.mediaType === 'image') content = `<img src="${m.mediaUrl}" onclick="window.open('${m.mediaUrl}')">`;
                if(m.mediaType === 'video') content = `<video controls src="${m.mediaUrl}"></video>`;
                if(m.mediaType === 'audio') content = `<audio controls src="${m.mediaUrl}" style="width:200px"></audio>`;
                
                list.innerHTML += `<div class="msg ${type}">${content}</div>`;
            });
            list.scrollTop = list.scrollHeight;
        });
    }

    // (Eski fonksiyonların devamı: login, register, loadFriends vb. buraya eklenecek)
    function login() { auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('pass').value).catch(e => alert(e.message)); }
    function logout() { auth.signOut(); }
    function showRegister() { alert("Kayıt fonksiyonu eski kodundaki gibi çalışır."); }
    function sendFriendRequest() { 
        const target = document.getElementById('target-email').value;
        db.ref('requests/' + btoa(target) + '/' + btoa(auth.currentUser.email)).set({ from: auth.currentUser.email });
        alert("İstek atıldı!");
    }
    function loadFriends() {
        db.ref('friends/' + btoa(auth.currentUser.email)).on('value', snap => {
            const list = document.getElementById('friends-list'); list.innerHTML = "";
            snap.forEach(c => { const mail = atob(c.key); list.innerHTML += `<div onclick="openChat('${mail}')" style="padding:15px; border-bottom:1px solid #eee; cursor:pointer">${mail}</div>`; });
        });
    }
    function openChat(mail) { currentChatUser = mail; document.getElementById('current-chat-name').innerText = mail; if(window.innerWidth < 700) toggleSidebar(); loadMessages(); }
    function listenRequests() { /* Eski kodundaki gibi istekleri dinle */ }
</script>
</body>
</html>
